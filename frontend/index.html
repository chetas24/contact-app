<!DOCTYPE html>
<html>
<head>
    <title>Contact Save Service</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<h2>Create Single Contact</h2>
<form id="singleContactForm">
    <input type="text" name="name" placeholder="Name" required maxlength="100">
    <input type="text" name="phoneNum" placeholder="Phone Number" required minlength="10" maxlength="15">
    <input type="date" name="birthday" required>
    <button type="submit">Save Contact</button>
</form>
<div id="singleResult"></div>
<script src="script.js"></script>
</body>
</html>
